name: MathModel
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10  # 稳定版本
  - pip=23.3.1  # 确保 pip 稳定

  # 核心数值计算
  - numpy=1.24.3
  - scipy=1.10.1

  # 数据处理与分析
  - pandas=2.0.3
  - openpyxl=3.1.2  # 支持 Excel 文件读写

  # 统计与建模
  - statsmodels=0.14.0
  - scikit-learn=1.3.0  # 基础机器学习（如回归、聚类）

  # 优化工具
  - pulp=2.7.0  # 线性/整数规划
  - sympy=1.11.1  # 符号计算

  # 可视化
  - matplotlib=3.7.2
  - seaborn=0.12.2

  # 科学计算扩展
  - mpmath=1.3.0  # 高精度算术
  - networkx=3.1  # 图论建模

  # 开发工具
  - jupyter=1.0.0  # 交互式 notebook（可选，但推荐）
  - ipykernel=6.25.1
  - notebook=7.0.6

  # 其他实用工具
  - tqdm=4.66.1  # 进度条
  - requests=2.31.0  # 数据下载

  # pip 安装的补充（如果 conda 包不全）
  - pip:
      - lark-parser==1.1.7  # 符号解析扩展（可选）